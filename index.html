<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      border: 0;
      background: black;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button id="start">Click to continue</button>

  <video id="video" playsinline>
    <source src="rickroll.mp4" type="video/mp4">
  </video>

  <script>
    const button = document.getElementById("start");
    const video = document.getElementById("video");

    button.addEventListener("click", async () => {
      button.remove();

      video.controls = false;
      video.muted = false;

      await video.play();

      if (video.requestFullscreen) {
        video.requestFullscreen();
      }
    });
  </script>

</body>
</html>
